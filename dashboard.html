<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LCSH harvest</title>
<style>
  body { margin: 0; background: #fff; color: #202122; font: 16px/1.45 Arial, Helvetica, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 30px; }
  h1 { font: normal 22px Georgia, serif; margin: 0 0 12px; }
  .state { font-weight: bold; }
  .ok { color: #14866d; } .warn { color: #ac6600; } .bad { color: #d33; }
  .bar { height: 10px; background: #eaecf0; margin: 10px 0 4px; }
  .bar div { height: 100%; background: #36c; width: 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  td { padding: 6px 0; border-top: 1px solid #eaecf0; vertical-align: top; }
  td:first-child { color: #72777d; width: 96px; }
  ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: #d33; }
  .small { font-size: 12px; color: #72777d; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>LCSH harvest</h1>
  <div><span id="state" class="state">…</span></div>
  <div class="bar"><div id="bar"></div></div>
  <div id="pct" class="small" style="margin:0"></div>
  <table>
    <tr><td>Done</td><td id="done"></td></tr>
    <tr><td>Rate</td><td id="rate"></td></tr>
    <tr><td>ETA</td><td id="eta"></td></tr>
    <tr><td>Last</td><td id="last"></td></tr>
    <tr><td>Started</td><td id="started"></td></tr>
    <tr><td>Errors</td><td id="errors"></td></tr>
  </table>
  <div id="updated" class="small"></div>
</main>
<script>
function t(iso) { return iso ? new Date(iso).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "–"; }
function ago(iso) { return Math.round((Date.now() - new Date(iso)) / 60000); }
function n(x) { return (x || 0).toLocaleString("en-US"); }
function show(s) {
  var mins = ago(s.updated), st = document.getElementById("state");
  var stale = s.state === "fetching" && mins > 15;
  st.textContent = stale ? "no update for " + mins + " min" : s.state;
  st.className = "state " + (stale || s.state === "stopped" ? "bad" : /paused/.test(s.state) ? "warn" : "ok");
  var pct = s.total ? 100 * s.done / s.total : 0;
  document.getElementById("bar").style.width = pct.toFixed(2) + "%";
  document.getElementById("pct").textContent = pct.toFixed(1) + "%";
  document.getElementById("done").textContent = n(s.done) + " / " + n(s.total);
  document.getElementById("rate").textContent = s.per_hour ? n(s.per_hour) + " / hour" : "–";
  document.getElementById("eta").textContent = s.state === "fetching" ? t(s.eta) : "–";
  document.getElementById("last").textContent = s.last ? s.last.heading + " (" + s.last.id + ")" : "–";
  document.getElementById("started").textContent = t(s.started);
  var e = s.errors || [];
  document.getElementById("errors").innerHTML = e.length ? e.length + "<ul>" + e.slice().reverse().map(function (x) {
    return "<li>" + x.replace(/[&<>]/g, "") + "</li>"; }).join("") + "</ul>" : "0";
  document.getElementById("updated").textContent = "updated " + mins + " min ago";
}
function load() {
  fetch("status.json?" + Date.now()).then(function (r) { return r.json(); }).then(show)
    .catch(function () { document.getElementById("state").textContent = "no status yet"; });
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
